<div id="scene-02" data-sceneid="02">

  <h1 data-timelinesequenceid="01"
      class="absolute top-80 left-100 text-6xl font-kalam bold text-purple">
    How MCP Works
  </h1>

  <audio src="/audio/scene_02_seq_01.mp3" data-audiotimelineseqid="01" />

  <div data-timelinesequenceid="02"
       class="absolute top-200 left-100 underline-green w-700 h-10"></div>

  <p data-timelinesequenceid="03"
     class="absolute top-280 left-100 text-3xl font-kalam text-gray w-1400 leading-relaxed">
    The host application (e.g. Claude Desktop) acts as an MCP client. It
    discovers MCP servers — lightweight processes that expose Tools, Resources,
    and Prompts over a local or remote transport layer.
  </p>

  <audio src="/audio/scene_02_seq_03.mp3" data-audiotimelineseqid="03" />
